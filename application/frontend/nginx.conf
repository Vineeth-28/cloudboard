server {
    listen 80;
    server_name _;

    # Static site root - the plain HTML/CSS/JS frontend from Phase 2.
    root /usr/share/nginx/html;
    index index.html;

    # Small perf/security defaults.
    gzip on;
    gzip_types text/css application/javascript application/json;
    server_tokens off;

    # --- Reverse proxy to the backend ---
    # This is what makes the frontend's relative fetch('/api/users') and
    # fetch('/health') calls work: the browser only ever talks to this Nginx
    # container (single origin, no CORS needed), and Nginx forwards those
    # specific paths to the backend service over the internal Docker network.
    # "backend" below is the Docker Compose / Kubernetes service name, not a
    # real hostname - Docker's embedded DNS resolves it to the backend
    # container's internal IP.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Static assets ---
    # try_files falls back to index.html for any path Nginx can't find as a
    # real file - not strictly needed for this single-page static site today,
    # but it's the standard pattern and costs nothing to have in place.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html itself should NOT be
    # cached long, so a new deploy is picked up immediately on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
