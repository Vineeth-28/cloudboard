name: CI

# Triggers:
# - pull_request: run checks on every PR before it's mergeable - this is the
#   quality gate. GitHub can be configured (Settings > Branches) to block
#   merging until this workflow passes.
# - push to main: run again after merge, so main itself is always verified,
#   not just the PR snapshot (protects against "merged main not equal to
#   what CI saw" edge cases, e.g. a merge commit conflict resolution).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If a new commit lands on a branch while this workflow is still running for
# an older commit on the same branch, cancel the older run - no point
# burning CI minutes checking code that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Docker Hub username/namespace images get pushed under - set as a repo
  # variable (Settings > Secrets and variables > Actions > Variables) or
  # just hardcode your Docker Hub username directly here, it's not secret.
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  # ---------------------------------------------------------------------
  # Job 1: lint-and-test
  # Fast feedback first - lint and unit tests fail in under a minute, so
  # there's no reason to wait for a full Docker build if the code itself
  # is broken. This job also runs in a plain Node environment (a GitHub-
  # hosted "runner" - a fresh Ubuntu VM Actions spins up per job), not in
  # Docker, since we don't need containerization to run `npm test`.
  # ---------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches ~/.npm keyed off package-lock.json - if dependencies
          # haven't changed since the last run, `npm ci` below restores
          # from cache instead of re-downloading everything from the
          # registry. Meaningful speedup on a repo this size.
          cache: "npm"
          cache-dependency-path: application/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------
  # Job 2: docker-build-and-scan
  # Only runs if lint-and-test succeeded (needs:) - no point building a
  # Docker image around code that's already known to be broken.
  # ---------------------------------------------------------------------
  docker-build-and-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          push: false
          load: true # makes the image available to `docker` locally in this job, for Trivy to scan
          tags: cloudboard-backend:${{ github.sha }}
          # GitHub Actions cache backend - reuses Docker layer cache between
          # workflow runs (stored in the Actions cache, not just this VM),
          # so unchanged layers (e.g. the deps stage from Phase 3) don't
          # get rebuilt on every single CI run.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          push: false
          load: true
          tags: cloudboard-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install Trivy
        # Installing the CLI directly instead of using the aquasecurity/
        # trivy-action Marketplace wrapper - that action's release tags
        # change over time and pinning to a stale one breaks the pipeline
        # with a resolution error. The official install script always
        # fetches a real, current release, so there's no tag to keep in
        # sync by hand.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan backend image (Trivy)
        # Only fail the build on CRITICAL/HIGH - lower-severity findings are
        # reported but don't block the pipeline. This is a real trade-off
        # teams make: block on what's genuinely dangerous, don't let noisy
        # low-severity CVEs stall every deploy.
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 cloudboard-backend:${{ github.sha }}

      - name: Scan frontend image (Trivy)
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 cloudboard-frontend:${{ github.sha }}

      # ---------------------------------------------------------------
      # Push to Docker Hub - only on push to main, never on PRs.
      # Reasoning: a PR could come from an untrusted fork, and even for
      # trusted PRs, pushing an image for every single commit on every
      # branch would flood the registry with images nobody deploys.
      # Only main - the branch that's actually mergeable/deployable -
      # gets images pushed for it.
      # ---------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          push: true
          # Two tags, both pushed for the same build:
          #   - the git SHA: immutable, uniquely identifies exactly which
          #     commit produced this image. This is what Kubernetes/Helm
          #     deployments should reference - "deploy commit abc1234" is
          #     unambiguous and reproducible.
          #   - "latest": a floating, human-convenient pointer to whatever
          #     was most recently pushed. Fine to look at in Docker Hub's
          #     UI, but never safe to depend on for a real deployment -
          #     "latest" today is not the same image as "latest" tomorrow.
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/cloudboard-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/cloudboard-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME}}/cloudboard-frontend:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/cloudboard-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
